name: بناء منبر الزكاة APK

on:
  push:
    branches: [ main, رئيسي ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت فلاتر
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: تكملة ملفات المشروع الناقصة
        run: |
          # لو مجلد android ما موجود، خلي فلاتر ينشئه
          if [ ! -d "android" ]; then
            flutter create . --project-name manbar_alzakae --org com.manbar.zakae --platforms android
          fi
          flutter pub get

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: manbar-alzakae-apk
          path: build/app/outputs/flutter-apk/app-release.apk
